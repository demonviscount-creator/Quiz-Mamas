<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Kosakata Hiragana & Katakana</title>
  <style>
    :root {
      --primary-color: #ff4b72;
      --primary-hover: #e0365c;
      --bg-color: #fff0f3;
      --card-bg: #ffffff;
      --text-color: #2b2d42;
      --success-color: #38b000;
      --error-color: #d90429;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .quiz-container {
      background-color: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(255, 75, 114, 0.15);
      width: 100%;
      max-width: 500px;
      padding: 30px;
      text-align: center;
      border: 2px solid #ffccd5;
    }

    .welcome-screen, .result-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .heart-icon {
      font-size: 50px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    h1 {
      color: var(--primary-color);
      font-size: 24px;
      margin-bottom: 5px;
    }

    .welcome-text {
      font-size: 18px;
      line-height: 1.6;
      color: #555;
      background: #fff5f6;
      padding: 15px;
      border-radius: 12px;
      border: 1px dashed var(--primary-color);
      font-weight: 600;
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(255, 75, 114, 0.3);
      width: 100%;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    .quiz-screen {
      display: none;
    }

    .quiz-header {
      margin-bottom: 15px;
      font-size: 16px;
      font-weight: bold;
      color: #777;
    }

    .question-card {
      background-color: #fff;
      border: 2px solid #ffe5ec;
      border-radius: 15px;
      padding: 25px 15px;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }

    .badge-type {
      display: inline-block;
      background-color: #ffe5ec;
      color: var(--primary-color);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .japanese-text {
      font-size: 42px;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 8px;
      word-break: break-all;
    }

    .meaning-text {
      font-size: 15px;
      color: #666;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background-color: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      border-color: var(--primary-color);
      background-color: #fff5f6;
    }

    .option-btn.correct {
      background-color: #d4edda;
      border-color: var(--success-color);
      color: #155724;
    }

    .option-btn.wrong {
      background-color: #f8d7da;
      border-color: var(--error-color);
      color: #721c24;
    }

    .score-badge {
      font-size: 22px;
      font-weight: bold;
      color: var(--primary-color);
      background: #ffe5ec;
      padding: 10px 20px;
      border-radius: 20px;
      margin: 15px 0;
    }

    .final-message {
      font-size: 19px;
      font-weight: bold;
      color: var(--primary-color);
      line-height: 1.5;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <!-- Welcome Screen -->
    <div id="welcome-screen" class="welcome-screen">
      <div class="heart-icon">🌸♥️</div>
      <h1>Tebak Kata Hiragana & Katakana</h1>
      <div class="welcome-text">
        Untuk mamas tersayang, Semangat belajarnya mamas♥️
      </div>
      <button class="btn" onclick="startQuiz()">Mulai Kuis ❤️</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="quiz-screen">
      <div class="quiz-header">
        <h2>🌸 Kuis Kosakata Jepang</h2>
      </div>

      <div class="question-card">
        <div id="question-number" style="font-size: 14px; color: #888; margin-bottom: 5px;">Soal 1 dari 30</div>
        <div id="badge-type" class="badge-type">Hiragana</div>
        <div id="japanese-question" class="japanese-text">ありがとう</div>
        <div id="meaning-question" class="meaning-text">Kata di atas artinya/dibaca apa?</div>
      </div>

      <div class="options-grid" id="options-container"></div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="result-screen" style="display: none;">
      <div class="heart-icon">🎁✨</div>
      <h1>Kuis Selesai!</h1>
      <div class="score-badge">
        Skor Mas Sugeng: <span id="final-score">0</span> / <span id="total-score">30</span>
      </div>
      <div class="final-message">
        WAH MAMAS SANGAT PINTAR♥️<br>
        LENNY SANGAT BANGGA, SAYANGGG SEKALII ♥️
      </div>
      <button class="btn" onclick="restartQuiz()">Coba Lagi ❤️</button>
    </div>
  </div>

  <script>
    // Bank Soal Kosakata Hiragana & Katakana (Total 30 Soal)
    const wordList = [
      // Hiragana
      { word: "ありがとう", type: "Hiragana", correct: "Arigatou (Terima kasih)", wrong: ["Konnichiwa (Halo)", "Sayounara (Selamat tinggal)", "Sumimasen (Maaf)"] },
      { word: "こんにちは", type: "Hiragana", correct: "Konnichiwa (Halo / Selamat siang)", wrong: ["Ohayou (Selamat pagi)", "Konbanwa (Selamat malam)", "Oyasumi (Selamat tidur)"] },
      { word: "おはよう", type: "Hiragana", correct: "Ohayou (Selamat pagi)", wrong: ["Arigatou (Terima kasih)", "Konnichiwa (Selamat siang)", "Jaa ne (Sampai jumpa)"] },
      { word: "こんばんわ", type: "Hiragana", correct: "Konbanwa (Selamat malam)", wrong: ["Ohayou (Selamat pagi)", "Tadaima (Aku pulang)", "Okaeri (Selamat datang kembali)"] },
      { word: "おやすみ", type: "Hiragana", correct: "Oyasumi (Selamat tidur)", wrong: ["Itadakimasu (Selamat makan)", "Gochisosama (Terima kasih makanannya)", "Okaeri (Selamat pulang)"] },
      { word: "すみません", type: "Hiragana", correct: "Sumimasen (Permisi / Maaf)", wrong: ["Gomenne (Maafkan aku)", "Arigatou (Terima kasih)", "Iie (Tidak)"] },
      { word: "さようなら", type: "Hiragana", correct: "Sayounara (Selamat tinggal)", wrong: ["Mata ne (Sampai nanti)", "Konnichiwa (Selamat siang)", "Hai (Ya)"] },
      { word: "いただきます", type: "Hiragana", correct: "Itadakimasu (Selamat makan)", wrong: ["Gochisosama (Selesai makan)", "Tadaima (Aku pulang)", "Okaeri (Selamat datang)"] },
      { word: "ただいま", type: "Hiragana", correct: "Tadaima (Aku pulang / Saya kembali)", wrong: ["Okaeri (Selamat datang)", "Itekimasu (Saya berangkat)", "Oyasumi (Selamat tidur)"] },
      { word: "おかえり", type: "Hiragana", correct: "Okaeri (Selamat datang kembali)", wrong: ["Tadaima (Aku pulang)", "Sumimasen (Permisi)", "Gomen (Maaf)"] },
      { word: "ねこ", type: "Hiragana", correct: "Neko (Kucing)", wrong: ["Inu (Anjing)", "Tori (Burung)", "Sakana (Ikan)"] },
      { word: "いぬ", type: "Hiragana", correct: "Inu (Anjing)", wrong: ["Neko (Kucing)", "Uma (Kuda)", "Saru (Monyet)"] },
      { word: "さくら", type: "Hiragana", correct: "Sakura (Bunga Sakura)", wrong: ["Mizu (Air)", "Hana (Bunga)", "Yama (Gunung)"] },
      { word: "みず", type: "Hiragana", correct: "Mizu (Air)", wrong: ["Ame (Hujan)", "Yuki (Salju)", "Kaze (Angin)"] },
      { word: "わたし", type: "Hiragana", correct: "Watashi (Saya / Aku)", wrong: ["Anata (Kamu)", "Kare (Dia)", "Minna (Semua)"] },

      // Katakana
      { word: "コーヒー", type: "Katakana", correct: "Ko-hi- (Kopi)", wrong: ["K-hi- (Teh)", "Ju-su (Jus)", "Mi-ru-ku (Susu)"] },
      { word: "カメラ", type: "Katakana", correct: "Kamera (Kamera)", wrong: ["Teredi (TV)", "Razio (Radio)", "Pasokon (Komputer)"] },
      { word: "パン", type: "Katakana", correct: "Pan (Roti)", wrong: ["Penzu (Pena)", "Pai (Pai)", "Pin (Jepit)"] },
      { word: "テレビ", type: "Katakana", correct: "Terebi (Televisi)", wrong: ["Teredi (Radio)", "Razio (Radio)", "Kamera (Kamera)"] },
      { word: "ホテル", type: "Katakana", correct: "Hoteru (Hotel)", wrong: ["Hoteru (Restoran)", "Su-pa- (Supermarket)", "Depa-to (Department Store)"] },
      { word: "タクシー", type: "Katakana", correct: "Takushi- (Taksi)", wrong: ["Basu (Bus)", "Baito (Kerja paruh waktu)", "Toire (Toilet)"] },
      { word: "バス", type: "Katakana", correct: "Basu (Bus)", wrong: ["Takushi- (Taksi)", "Baito (Kerja paruh waktu)", "Bi-ru (Bir)"] },
      { word: "トイレ", type: "Katakana", correct: "Toire (Toilet)", wrong: ["Terebi (TV)", "Hoteru (Hotel)", "Tabelu (Meja)"] },
      { word: "ジュース", type: "Katakana", correct: "Ju-su (Jus)", wrong: ["Ko-hi- (Kopi)", "Sora (Langit)", "Mi-ru-ku (Susu)"] },
      { word: "アイス", type: "Katakana", correct: "Aisu (Es Krim)", wrong: ["Aka (Merah)", "Ame (Permen)", "Aisu (Es Batu)"] },
      { word: "ケーキ", type: "Katakana", correct: "Ke-ki (Kue / Cake)", wrong: ["Pan (Roti)", "Ju-su (Jus)", "Kare- (Kari)"] },
      { word: "ラーメン", type: "Katakana", correct: "Ra-men (Ramen)", wrong: ["Udon (Udon)", "Soba (Soba)", "Sushi (Sushi)"] },
      { word: "チョコレート", type: "Katakana", correct: "Chokore-to (Cokelat)", wrong: ["Ke-ki (Kue)", "Aisu (Es krim)", "Kandi (Permen)"] },
      { word: "ノート", type: "Katakana", correct: "No-to (Buku Catatan)", wrong: ["Pen (Pulpen)", "Kado (Kartu)", "Te-pu (Isolasi)"] },
      { word: "スマホ", type: "Katakana", correct: "Sumaho (Smartphone)", wrong: ["Terebi (TV)", "Kamera (Kamera)", "Pasokon (Laptop)"] }
    ];

    let quizData = [];
    let currentQuestion = 0;
    let score = 0;
    let canAnswer = true;

    function generateQuizData() {
      const shuffled = [...wordList].sort(() => 0.5 - Math.random());

      quizData = shuffled.map(item => {
        const options = [item.correct, ...item.wrong].sort(() => 0.5 - Math.random());
        return {
          word: item.word,
          type: item.type,
          options: options,
          correctIndex: options.indexOf(item.correct)
        };
      });
    }

    function startQuiz() {
      generateQuizData();
      currentQuestion = 0;
      score = 0;
      document.getElementById('welcome-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'block';
      loadQuestion();
    }

    function loadQuestion() {
      canAnswer = true;
      const q = quizData[currentQuestion];
      document.getElementById('question-number').innerText = `Soal ${currentQuestion + 1} dari ${quizData.length}`;
      document.getElementById('badge-type').innerText = q.type;
      document.getElementById('japanese-question').innerText = q.word;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(index, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, btnElement) {
      if (!canAnswer) return;
      canAnswer = false;

      const q = quizData[currentQuestion];
      const buttons = document.querySelectorAll('.option-btn');

      if (selectedIndex === q.correctIndex) {
        btnElement.classList.add('correct');
        score++;
      } else {
        btnElement.classList.add('wrong');
        buttons[q.correctIndex].classList.add('correct');
      }

      setTimeout(() => {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
          loadQuestion();
        } else {
          showResult();
        }
      }, 1000);
    }

    function showResult() {
      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'flex';
      document.getElementById('final-score').innerText = score;
      document.getElementById('total-score').innerText = quizData.length;
    }

    function restartQuiz() {
      document.getElementById('result-screen').style.display = 'none';
      startQuiz();
    }
  </script>
</body>
</html>
